name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libsqlite3-dev \
          sqlite3 \
          bzip2 \
          libbz2-dev \
          libssl-dev \
          openssl \
          libgdbm-dev \
          libgdbm-compat-dev \
          liblzma-dev \
          libreadline-dev \
          libncursesw5-dev \
          libffi-dev \
          uuid-dev \
          xclip \
          xsel \
          libjpeg-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          unzip \
          zip \
          ccache

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Pre-accept Android SDK Licenses for Buildozer
      run: |
        # Заранее создаем внутреннюю структуру папок для локального SDK Buildozer
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        
        # Принудительно генерируем файлы одобрения всех лицензий Google SDK (включая aidl и build-tools)
        echo "244d2d05d31d39116e1dae29037a7028af17b1a4" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        echo "6523030d9a7d24b67da647b19908de47ed5d4f3b" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license

    - name: Build Android APK with Buildozer
      run: |
        # Запуск сборки без удаления локальной папки .buildozer (чтобы сохранить подложенные файлы лицензий)
        buildozer -v android debug
      env:
        # Передаем только Java. Android-переменные не передаем, позволяя Buildozer изолированно скачать SDK
        JAVA_HOME: ${{ env.JAVA_HOME }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
